name: Infrastructure (Terraform)

# Every AWS change goes through here - nothing is changed by hand in the console.
#   Pull request   -> format check, validate, and a read-only plan in the run summary
#   Push to main   -> plan, then apply once you approve the "production" environment
#   Run workflow   -> one-time migration steps (discover, retire-cloudformation) or a manual apply

on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/terraform/**', '.github/workflows/infra.yml']
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options: [plan-and-apply, discover, retire-cloudformation]
        default: plan-and-apply

permissions:
  id-token: write # lets GitHub prove its identity to AWS - no stored keys
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VERSION: '~1.13.0'
  WORKDIR: infra/terraform
  ALLOW_FRESH_INSTALL: ${{ vars.ALLOW_FRESH_INSTALL }} # only for a brand-new copy of the site

jobs:
  check:
    name: Format and validate
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan-and-apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
        working-directory: ${{ env.WORKDIR }}
      - run: terraform init -backend=false && terraform validate
        working-directory: ${{ env.WORKDIR }}

  plan:
    name: Plan
    needs: check
    # Forks never get AWS access
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      ready: ${{ steps.settings.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: settings
        name: Load settings
        run: ./infra/terraform/scripts/load-settings.sh
      - if: steps.settings.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - if: steps.settings.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: steps.settings.outputs.ready == 'true'
        id: plan
        name: Terraform plan (read-only)
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          ./scripts/guard.sh
          set +e
          terraform plan -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            grep -E '^(Plan:|No changes|Error|  # )' plan.txt || true
            echo '```'
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          [ $code -eq 1 ] && exit 1
          echo "changes=$([ $code -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if grep -qE ' (must be replaced|will be destroyed)' plan.txt; then
            echo "::warning::This plan DESTROYS or REPLACES resources - read it carefully before approving."
          fi

  apply:
    name: Apply (needs approval)
    needs: plan
    if: >-
      needs.plan.outputs.ready == 'true' && needs.plan.outputs.changes == 'true' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production # add yourself as a required reviewer in Settings -> Environments
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/terraform/scripts/load-settings.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          ./scripts/guard.sh
          terraform plan -no-color -out=tfplan
          terraform apply -no-color tfplan
          terraform output -no-color | tee -a "$GITHUB_STEP_SUMMARY"

  discover:
    name: Discover CloudFormation resources (one-time)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'discover'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write # pushes the generated files to the terraform-import branch
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/terraform/scripts/load-settings.sh --require
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: ./infra/terraform/scripts/discover.sh
      - name: Push the generated files to the terraform-import branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B terraform-import
          git add infra/terraform/imports.tf infra/terraform/existing.auto.tfvars
          git commit -m "Adopt the CloudFormation resources into Terraform (generated by discover.sh)"
          git push --force origin terraform-import
          echo "Open a pull request from **terraform-import** to see the import plan." >> "$GITHUB_STEP_SUMMARY"

  retire:
    name: Retire the CloudFormation stack (one-time, needs approval)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'retire-cloudformation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: ./infra/terraform/scripts/load-settings.sh --require
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check Terraform already owns everything
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -backend-config="bucket=$TF_STATE_BUCKET"
          state=$(terraform state list)
          for r in aws_cognito_user_pool.members aws_dynamodb_table.main aws_s3_bucket.site \
                   aws_cloudfront_distribution.site aws_lambda_function.api aws_apigatewayv2_api.api \
                   aws_iam_role.deploy aws_iam_role.api; do
            grep -qx "$r" <<<"$state" || { echo "::error::$r is not in Terraform state yet - merge the import first."; exit 1; }
          done
          terraform plan -no-color -detailed-exitcode || { echo "::error::Terraform has pending changes - apply them first."; exit 1; }
      - run: ./infra/terraform/scripts/retire-cloudformation.sh
      - name: Confirm everything is still there
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -no-color -detailed-exitcode
