name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub prove its identity to AWS - no stored keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test api/test/*.test.js test/*.test.js

      - name: Build site
        run: node build.js
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          COGNITO_REGION: ${{ vars.AWS_REGION }}
          COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}

      - name: Package API
        run: cd api && zip -qr ../lambda.zip index.mjs package.json src -x 'src/fake-dynamo.js'

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update API code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.API_FUNCTION_NAME }}" \
            --zip-file fileb://lambda.zip >/dev/null
          aws lambda wait function-updated --function-name "${{ vars.API_FUNCTION_NAME }}"

      - name: Upload website
        run: |
          # Styles, scripts and images cache for an hour; pages and data refresh within a minute
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" --exclude "*.json" --exclude "config.js" \
            --cache-control "public,max-age=3600"
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude "*" --include "*.html" --include "*.xml" --include "*.txt" --include "*.json" --include "config.js" \
            --cache-control "public,max-age=60"

      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" >/dev/null
