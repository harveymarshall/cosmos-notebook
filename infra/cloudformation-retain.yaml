# HAND-OVER TEMPLATE - used once by the "retire-cloudformation" step of
# .github/workflows/infra.yml. Identical to cloudformation.yaml except that EVERY resource
# is set to Retain, so deleting the old stack leaves all resources running for Terraform.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cosmos Notebook - static site (S3 + CloudFront) with member accounts (Cognito),
  an API (API Gateway HTTP API + one Lambda) and a database (DynamoDB). All serverless,
  pay-per-use, and within AWS free tiers at hobby scale.

Parameters:
  GitHubRepo:
    Type: String
    Default: ''
    Description: >
      Optional. Your GitHub repository as owner/name (e.g. jsmith/cosmos-notebook), to deploy
      automatically on every push. Leave blank to deploy from your own computer instead.
    AllowedPattern: '^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch that deploys the site.
  CreateGitHubOIDCProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to false only if your AWS account already has the
      token.actions.githubusercontent.com identity provider (one per account).
  ApiRateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Average API requests per second allowed across the whole site (protects your bill).
  ApiBurstLimit:
    Type: Number
    Default: 40
    MinValue: 1
    Description: Short bursts of API requests allowed above the rate limit.

Conditions:
  HasRepo: !Not [!Equals [!Ref GitHubRepo, '']]
  MakeOIDC: !And [!Condition HasRepo, !Equals [!Ref CreateGitHubOIDCProvider, 'true']]

Resources:
  # ------------------------------------------------------------------ website files
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # Lets S3 answer "404 Not Found" (instead of "403") for pages that don't exist
          - Sid: AllowCloudFrontList
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # ------------------------------------------------------------------ member accounts
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-members'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Cosmos Notebook code
        EmailMessage: 'Welcome to Cosmos Notebook! Your confirmation code is {####}'
      DeletionProtection: ACTIVE

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupName: admins
      Description: Can review library suggestions and remove community posts
      UserPoolId: !Ref UserPool

  # ------------------------------------------------------------------ database
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true

  # ------------------------------------------------------------------ API
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 14

  ApiFunctionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt Table.Arn
                  - !Sub '${Table.Arn}/index/*'

  ApiFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Description: Cosmos Notebook API. The real code is uploaded by the deploy step.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiFunctionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ error: 'The API has not been deployed yet. Run the deploy step from the README.' })
          });

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      Description: Cosmos Notebook API (reached through CloudFront at /api)

  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 10000

  # Public (no login needed)
  RouteHealth:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/health', Target: !Sub 'integrations/${ApiIntegration}' }
  RouteLibrary:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/library', Target: !Sub 'integrations/${ApiIntegration}' }
  RouteFeed:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/feed', Target: !Sub 'integrations/${ApiIntegration}' }
  RoutePost:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/posts/{postId}', Target: !Sub 'integrations/${ApiIntegration}' }
  RouteComments:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: { ApiId: !Ref HttpApi, RouteKey: 'GET /api/posts/{postId}/comments', Target: !Sub 'integrations/${ApiIntegration}' }

  # Everything else needs a valid login token
  RoutePrivate:
    Type: AWS::ApiGatewayV2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /api/{proxy+}'
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub 'integrations/${ApiIntegration}'

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

  # ------------------------------------------------------------------ CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Turns /experiments/weigh-jupiter/ into /experiments/weigh-jupiter/index.html
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}-index-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for folder-style URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.split('/').pop().indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # CloudFront only passes the login header on GET requests if it is part of the cache key.
  # Max TTL of 1 second plus the API's "no-store" header means nothing is actually cached.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-api'
        Comment: Forward the Authorization header and query strings; effectively no caching
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization]

  Distribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} site'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site-bucket
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        # Only 404 is mapped (S3 answers 404 for missing pages thanks to ListBucket above),
        # so the API's own 401/403 answers reach the app unchanged.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

  # ------------------------------------------------------------------ keyless deploys from GitHub
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: MakeOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Condition: HasRepo
    Properties:
      Description: Lets GitHub Actions upload the site, update the API code and clear the cache - nothing else.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOIDC
                - !Ref GitHubOIDCProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # GitHub uses either "repo:owner/name:..." or, newer, "repo:owner@<id>/name@<id>:..."
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
                  - !Sub
                    - 'repo:${Owner}@*/${Name}@*:ref:refs/heads/${GitHubBranch}'
                    - Owner: !Select [0, !Split ['/', !Ref GitHubRepo]]
                      Name: !Select [1, !Split ['/', !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt ApiFunction.Arn

Outputs:
  HandedOverTo:
    Description: These resources are now managed by Terraform (infra/terraform)
    Value: terraform
  SiteURL:
    Description: Your live site - share this link
    Value: !Sub 'https://${Distribution.DomainName}'
  BucketName:
    Description: S3_BUCKET
    Value: !Ref SiteBucket
  DistributionId:
    Description: CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  ApiFunctionName:
    Description: API_FUNCTION_NAME
    Value: !Ref ApiFunction
  UserPoolId:
    Description: Where member accounts live (Cognito console) - add admins here
    Value: !Ref UserPool
  UserPoolClientId:
    Description: COGNITO_CLIENT_ID
    Value: !Ref UserPoolClient
  Region:
    Description: AWS_REGION and COGNITO_REGION
    Value: !Ref AWS::Region
  DeployRoleArn:
    Condition: HasRepo
    Description: AWS_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
